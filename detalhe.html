  .pay-value{font-weight:900;font-size:0.9rem;color:var(--text);}

  .pros,.cons{background:var(--card);border-radius:12px;padding:18px;}

  .pros li,.cons li{color:#aaa;font-size:0.85rem;line-height:1.6;margin-left:16px;}

function renderStars(rating) {
  const r = parseFloat(rating);
  let s = "";
  for(let i=1;i<=5;i++){
    if(i<=Math.floor(r)) s+="★";
    else if(i-r<1&&i-r>0) s+="★";
    else s+="☆";
  }
  return s;
}
